# LingbotVA policy configuration for GT teacher-forced KV-cache tests.
robotwin_root: /gemini/code/robotwin

host: 127.0.0.1
port: 8000
video_guidance_scale: 5.0
action_guidance_scale: 5.0
save_visualization: false

# Execute model-predicted actions in the perturbed env, but always update the
# server KV cache with GT history from the recovery dataset.
gt_warmstart_chunks: 0
gt_cache_teacher_force: true
gt_warmstart_frame_chunk_size: 2
gt_warmstart_action_per_frame: 16
gt_warmstart_dataset_root: /gemini/code/datasets/robotwin-perturbed-recovery-50fps/adjust_bottle-aloha-perturbed_recovery
